# =============================================================================
# SafeEdge HazardGuard - Render.com Infrastructure Blueprint
# Allows one-click automated deployment of Backend, Database, and Dashboard
# =============================================================================

databases:
  - name: safeedge-postgres
    databaseName: safeedge_db
    user: safeedge_user
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Cloud Telemetry Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: safeedge-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safeedge-postgres
          property: connectionString
      - key: SAFEEDGE_API_KEY
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
      - key: STALE_TIMEOUT_SECONDS
        value: "5.0"
      - key: CORS_ORIGINS
        value: "https://*.streamlit.app,http://localhost:8501"
      - key: MQTT_BROKER_HOST
        value: "broker.hivemq.com"
      - key: MQTT_BROKER_PORT
        value: "8883"
      - key: MQTT_USE_TLS
        value: "true"

  # ---------------------------------------------------------------------------
  # 2. Streamlit Public Monitoring Dashboard
  # ---------------------------------------------------------------------------
  - type: web
    name: safeedge-dashboard
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: SAFEEDGE_BACKEND_URL
        fromService:
          type: web
          name: safeedge-backend
          property: host
      - key: SAFEEDGE_DEVICE_ID
        value: "safeedge-esp32-01"
      - key: SAFEEDGE_API_KEY
        fromService:
          type: web
          name: safeedge-backend
          envVarKey: SAFEEDGE_API_KEY

